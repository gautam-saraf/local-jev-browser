<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Local Browser Agent Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>

<h1>Developer Portal</h1>

<p>Your goal is to find the API documentation.</p>

<button onclick="show('Pricing page opened')">
    Pricing
</button>

<button onclick="show('Careers page opened')">
    Careers
</button>

<button onclick="show('API DOCUMENTATION FOUND')">
    API Documentation
</button>

<button onclick="show('Contact page opened')">
    Contact
</button>

<div id="result">
    No action executed yet.
</div>

<script>
function show(message) {
    document.getElementById("result").innerText = message;
}
</script>

</body>
</html>
